AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AI-Driven Hotel Booking Assistant - Bedrock Agent action group backend.
  Provisions DynamoDB inventory + bookings tables, the Lambda action handler,
  and least-privilege IAM so the Bedrock Agent can invoke the function.

Parameters:
  ProjectName:
    Type: String
    Default: hotel-booking-assistant
    Description: Prefix used to name resources.

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: python3.12
    Architectures:
      - x86_64

Resources:

  # ---------------------------------------------------------------------------
  # DynamoDB: Inventory table.  PK = date (String). Attributes: seaView, gardenView.
  # On-demand billing so it scales to zero cost when idle and absorbs spikes.
  # ---------------------------------------------------------------------------
  InventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-inventory'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: date
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ---------------------------------------------------------------------------
  # DynamoDB: Bookings table. PK = bookingId (String, a UUID generated by Lambda).
  # GSI lets an admin query all bookings for a given date.
  # ---------------------------------------------------------------------------
  BookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-bookings'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bookingId
          AttributeType: S
        - AttributeName: checkInDate
          AttributeType: S
      KeySchema:
        - AttributeName: bookingId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: checkInDate-index
          KeySchema:
            - AttributeName: checkInDate
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ---------------------------------------------------------------------------
  # Lambda: the Bedrock Agent action group handler.
  # Least-privilege: only DynamoDB CRUD on the two tables above.
  # ---------------------------------------------------------------------------
  BookingActionHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-action-handler'
      CodeUri: src/booking_handler/
      Handler: app.lambda_handler
      Description: Handles checkAvailability, bookRoom, and updateInventory for the Bedrock Agent.
      Environment:
        Variables:
          INVENTORY_TABLE: !Ref InventoryTable
          BOOKINGS_TABLE: !Ref BookingsTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: InventoryTableAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:PutItem
              Resource: !GetAtt InventoryTable.Arn
            - Sid: BookingsTableAccess
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:DeleteItem
              Resource:
                - !GetAtt BookingsTable.Arn
                - !Sub '${BookingsTable.Arn}/index/*'

  # ---------------------------------------------------------------------------
  # Resource policy: allow ONLY the Bedrock service to invoke the function.
  # SourceAccount scopes it to this account so other accounts' agents cannot call it.
  # ---------------------------------------------------------------------------
  BedrockInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BookingActionHandler
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

Outputs:
  InventoryTableName:
    Description: Name of the DynamoDB inventory table.
    Value: !Ref InventoryTable
  BookingsTableName:
    Description: Name of the DynamoDB bookings table.
    Value: !Ref BookingsTable
  BookingActionHandlerArn:
    Description: ARN of the Lambda action handler (wire this into the Bedrock Agent action group).
    Value: !GetAtt BookingActionHandler.Arn
  BookingActionHandlerName:
    Description: Name of the Lambda action handler.
    Value: !Ref BookingActionHandler
